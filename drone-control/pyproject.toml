[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini4pro-indoor-nav"
version = "1.0.0"
description = "Fail-safe PC controller for two-tag indoor straight-line navigation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vision = ["av>=12.0", "opencv-python>=4.8", "pupil-apriltags>=1.0.4", "numpy>=1.24"]

[project.scripts]
drone-nav = "drone_nav.cli:main"

[tool.setuptools]
package-dir = {"" = "pc"}

[tool.setuptools.packages.find]
where = ["pc"]
